name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    # Secrets can't be read in `if:` directly; lift them to job env.
    env:
      MEMORY_MCP_URL: ${{ secrets.MEMORY_MCP_URL }}
      MEMORY_AUTH_TOKEN: ${{ secrets.MEMORY_AUTH_TOKEN }}
      # Optional: lets CI redeploy the throwaway e2e worker from this commit
      # before testing it. Token needs Workers Scripts Write (+ Account
      # Settings Read) on the account that owns agent-memory-mcp-e2e. Without
      # it, e2e runs against whatever was last deployed by hand.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip notice (no deployed-worker secrets)
        if: env.MEMORY_MCP_URL == '' || env.MEMORY_AUTH_TOKEN == ''
        run: echo "::notice title=E2E skipped::MEMORY_MCP_URL / MEMORY_AUTH_TOKEN repo secrets not set; skipping deployed-worker E2E."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy e2e worker from this commit
        if: env.MEMORY_MCP_URL != '' && env.MEMORY_AUTH_TOKEN != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --config wrangler.e2e.jsonc --message "ci ${GITHUB_SHA::7}"

      - name: Stale-worker notice (no deploy token)
        if: env.MEMORY_MCP_URL != '' && env.MEMORY_AUTH_TOKEN != '' && env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning title=E2E against last manual deploy::CLOUDFLARE_API_TOKEN not set; e2e tests the worker as last deployed, not this commit."

      - name: Run E2E tests
        if: env.MEMORY_MCP_URL != '' && env.MEMORY_AUTH_TOKEN != ''
        run: npm run test:e2e
